name: Build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 cmake ninja-build
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/mingw.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: winshell-windows
          path: build/winshell.exe build/winshell-setup.exe build/winshell-start.exe
        
